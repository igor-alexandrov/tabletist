# Databases for integration tests:
#   docker compose up -d --build --wait postgres mysql ssh
#   TABLETIST_TEST_PG_URL=postgres://tabletist:tabletist@localhost:55432/tabletist \
#   TABLETIST_TEST_MYSQL_URL=mysql://tabletist:tabletist@localhost:53306/tabletist \
#   TABLETIST_TEST_SSH_URL=ssh://tabletist:tabletist@localhost:52222 \
#     cargo test --workspace
#
# Ports are published on 127.0.0.1 only: the credentials are public.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tabletist
      POSTGRES_PASSWORD: tabletist
      POSTGRES_DB: tabletist
    ports:
      - "127.0.0.1:55432:5432"
    # TLS with the image's self-signed certificate, so every sslmode can be tested.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tabletist"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tabletist-root
      MYSQL_DATABASE: tabletist
      MYSQL_USER: tabletist
      MYSQL_PASSWORD: tabletist
    ports:
      - "127.0.0.1:53306:3306"
    # With its binary log on, the server lets only a SUPER user make a
    # trigger. The tests' user is none, and one test needs a trigger.
    command:
      - --log-bin-trust-function-creators=1
    volumes:
      # A second database, so schema listing has more than one.
      - ./compose/mysql-init.sql:/docker-entrypoint-initdb.d/billing.sql:ro
    # Healthy only once the final server listens on TCP (the init server
    # does not), so `docker compose up --wait` returns when tests can run.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "tabletist", "-ptabletist", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 90
  # SSH server for tunnel tests. It reaches the databases by service name
  # (postgres:5432, mysql:3306), which the host cannot resolve.
  ssh:
    build:
      context: .
      dockerfile: compose/ssh/Dockerfile
    ports:
      - "127.0.0.1:52222:22"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      timeout: 5s
      retries: 30
