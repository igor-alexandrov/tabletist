[package]
name = "tabletist-appkit"
version = "0.1.0"
description = "The CoreText calls Tabletist cannot make without unsafe code"
edition.workspace = true
rust-version.workspace = true
publish = false

# The workspace forbids unsafe code. Listing the installed fonts means
# reading CoreText's C statics and untyped collections, so this crate carries
# the workspace's lints with `unsafe_code` lowered to `deny`, allowed only in
# `fonts.rs`, each use with a SAFETY note. The app and the database layer
# keep `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
# The autorelease pool the font queries run in (`fonts.rs`): the version the
# app's title bar code uses.
objc2 = "0.6"
# CoreText's list of the installed fonts, for the data font's menu
# (`fonts.rs`), and the CoreFoundation types it answers in. The versions the
# app's objc2-app-kit builds with; CoreText's crate is the one new crate.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFSet", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontCollection", "CTFontDescriptor", "CTFontTraits"] }
