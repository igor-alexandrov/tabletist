[package]
name = "tabletist-core"
# The app's version: `update::CURRENT`, the relay and the agents' server
# read `CARGO_PKG_VERSION`, which must be the app's (AGENTS.md, Releasing).
version.workspace = true
description = "Tabletist beneath its interface: the app's state and its edits, the backend, the settings, the keymap and the theme's data"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The updater's transport and its downloads report through fastframe-update,
# whose calls return anyhow's errors.
anyhow = "1"
# The files the app keeps (settings, connections, the session, recents,
# the theme) and the releases the updater reads, as TOML and JSON.
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps a JSON cell's text as it came (model.rs).
serde_json = { version = "1", features = ["raw_value"] }
# Warnings from the backend, the updater, the secrets and the settings,
# to the logger the app sets up.
log = "0.4"
# Platform config/state directories (XDG on Linux).
directories = "6"
# Three of its data types and no more: `Key` (the keymap), `Color32` (the
# palettes) and `FontData` (the fonts read from the system). Never eframe,
# and never a `Context` or a `Ui` (tests/interface.rs): fastframe-theme
# stands on egui itself, so egui is in this crate's tree either way.
# `serde` for the colours settings.toml and the theme files hold: eframe's
# `persistence` turns it on in the app already.
egui = { version = "0.36", features = ["serde"] }
# Checks that a font read from the system parses before egui loads it (egui
# panics on a font it cannot read): the desktop's monospace on Linux, an
# installed data font on macOS, whose face in a collection it finds by name.
# The version epaint already uses on every platform.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Palettes, presets, and following the Omarchy theme live.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.16.1" }
# gettext catalogs compiled at build time (see build.rs).
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.16.1" }
# Self-update from GitHub releases (src/update.rs): detects how this copy
# was installed, checks the signature on checksums.txt, hands an update to
# a helper that installs it and rolls back if the new version does not
# start.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.16.1" }
# The database layer (no UI dependencies).
tabletist-db = { path = "../tabletist-db" }
# The MCP server agents reach the saved connections through. The backend
# runs it, and is its gateway to the databases (src/backend/agents.rs).
tabletist-mcp = { path = "../tabletist-mcp" }
# The check for updates and the updater's HTTP client: blocking GETs to
# GitHub, on rustls with ring and Mozilla's roots (webpki-roots), all
# already in the tree. Adds ureq, ureq-proto, http, httparse, utf8-zero
# and base64 0.23 (beside the tree's 0.22); reqwest would add hyper, h2
# and tower. No gzip: release files are compressed already.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# `CancellationToken`: how the server tells its gateway that a call is
# over. In the tree through tabletist-mcp, which hands one to every call.
tokio-util = "0.7"
# The backend runtime: one OS thread running tokio, where every database
# call happens (src/backend.rs). `net` for the socket agents reach the app
# through, `io-util` and `io-std` for `tabletist mcp`, which copies its
# stdin and stdout to it (src/relay.rs). tabletist-db turns the first two
# on already: nothing new is built.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std"] }
# Native file dialogs (portal on Linux), built on the UI thread and awaited
# on the backend runtime.
rfd = "0.17"
# Stable ids for saved connections, so renaming one keeps its identity.
uuid = { version = "1", features = ["v4"] }
# The proofs the app and `tabletist mcp` give each other that each holds
# the key, before either says anything else (src/endpoint.rs). In the tree
# through russh, on every system: nothing new is built.
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }

# One protected-store API for saved passwords; each platform's native
# provider below. Passwords never go into connections.toml.
keyring-core = "1"
# Settings and state files are written through a uniquely named temporary
# file created exclusively (0600 on Unix) and renamed into place
# (src/util.rs).
tempfile = "3"
# Reads settings.toml: `DeTable::parse_recoverable` keeps what it could read
# of a file with a bad line and says where each key and each error is. And
# reads connections.toml, strictly, into its own types (`serde`, which adds
# no crate: serde is in the tree). The app writes both files itself
# (src/settings.rs, src/connections/file.rs), so no writer is built: the
# default `display` feature would bring in toml_writer.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Tells the backend when settings.toml changes on disk, so an edit made in
# an editor reaches the running app (src/backend.rs). The version and the
# features fastframe-theme already brings in for following the desktop's
# theme: nothing new is built.
notify = "8.2"
# The query history's file (src/history.rs), SQLite as the Agents Log's is.
# The version and the features tabletist-mcp already brings in: nothing new
# is built.
rusqlite = { version = "0.37", features = ["bundled"] }
# The person's clock and time zone, for the times of agents' calls, and the
# zone database a `timestamptz` value is shown in. The version and the
# features env_logger already brings in: nothing new is built.
jiff = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Notifications on the desktop (mako on Omarchy), for an agent that
# connects. The version and the features the keyring store already brings
# in: nothing new is built.
zbus = "5"
# The desktop's Secret Service (GNOME Keyring, KWallet) over D-Bus.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# The Secret Service itself, which the store above is built on, with the
# same features: nothing new is built. To ask whether an entry is locked
# before it is read, which the store's read would answer with a prompt to
# unlock it (`secrets::linux_locked`), for a read an agent's call made.
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The keychain store above is built on it. To tell the keychain to ask the
# person nothing while it reads for an agent (`secrets::NativeStore::
# read_quietly`), which the store has no call for. The version and the
# features the store builds: nothing new is built.
security-framework = "3.7"
# The installed fonts CoreText lists for the data font: CoreText calls that
# need unsafe code, kept in a crate of their own because this one forbids it.
tabletist-appkit = { path = "../tabletist-appkit" }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
# A paused clock (`start_paused`) for the backend test that reads the waits
# between two cancels, which grow to seconds: they pass at once, and exactly.
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.16.1", features = ["build"] }

[features]
# The test hooks and the data fixtures (`fixtures`), for the interface's
# tests: the root crate's dev-dependency turns it on. Resolver 3 enables a
# dev-dependency's features only for the targets that need it, so a release
# build never has them.
testing = []
