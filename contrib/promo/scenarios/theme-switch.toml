# Tabletist in the Omarchy look as Omarchy switches its theme: Tokyo
# Night, then Ristretto, Retro 82 and Catppuccin Latte. Each switch tells
# the app what the desktop's does, and it recolours as it follows the
# desktop. The desktop's own theme is never changed, but the themes'
# colours are read from Omarchy, so only an Omarchy machine renders it.
title = "Follows your Omarchy theme"
look = "omarchy"
tempo = 112

# Quick open, then vim's j and k down the rows.
[[scene]]
caption = "A native database client, with vim keys."
steps = [
  { command = "find_object" },
  { type = "books" },
  { press = "enter" },
  { command = "move_row", key = "j", times = 3 },
  { command = "move_row", key = "k" },
]

[[scene]]
caption = "Switch your Omarchy theme. Tabletist follows it live."
steps = [
  { omarchy = "Ristretto" },
  { hold = 0.8 },
  { omarchy = "Retro 82" },
  { hold = 0.8 },
]

[[scene]]
caption = "Light themes too, with no restart."
steps = [
  { command = "move_row", key = "j", times = 2 },
  { omarchy = "Catppuccin Latte" },
  { hold = 1.0 },
]
