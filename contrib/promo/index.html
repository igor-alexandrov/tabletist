<!doctype html>
<!-- The promotional video's composition. render.cjs opens this page, gives
     it the app's frames (target/promo/, from src/promo.rs) and asks for
     every frame of the video with renderAt(seconds). Nothing here runs on a
     clock: a time always draws the same picture. -->
<meta charset="utf-8">
<title>Tabletist promo</title>
<style>
  @font-face { font-family: "Plex"; src: url("../../assets/fonts/IBMPlexSans-Variable.ttf"); font-weight: 100 700; }
  @font-face { font-family: "Plex Mono"; src: url("../../assets/fonts/IBMPlexMono-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Keys"; src: url("../../assets/fonts/NotoSansSymbols2-Keys.ttf"); }
  :root { --ink: #f4f3ee; --dim: #a9a79e; --blue: #3b82f6; --deep: #1d4ed8; --night: #121311; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
  body { font-family: "Plex", sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1200px 700px at 50% 108%, rgba(59,130,246,.34), transparent 70%),
      radial-gradient(900px 600px at 12% -10%, rgba(29,78,216,.22), transparent 70%),
      var(--night); }
  #grid { position: absolute; inset: -80px; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); }

  #window { position: absolute; left: 0; top: 0; width: 1400px; height: 875px;
    transform-origin: 0 0; border-radius: 16px; overflow: hidden; will-change: transform;
    box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 50px 120px rgba(0,0,0,.65), 0 12px 30px rgba(0,0,0,.5); }
  #shot { display: block; width: 100%; height: 100%; }
  #lights { position: absolute; left: 23px; top: 22px; display: flex; gap: 9.4px; }
  #lights i { width: 14px; height: 14px; border-radius: 50%; display: block;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }

  #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
    background: linear-gradient(transparent, rgba(12,13,12,.9) 52%, rgba(12,13,12,.98)); }
  #caption { position: absolute; left: 0; right: 0; bottom: 62px; height: 96px;
    display: flex; align-items: center; justify-content: center; gap: 30px; }
  #line { font-size: 66px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
  #line span { display: inline-block; white-space: pre; }
  #key { font-family: "Plex", "Keys", sans-serif; font-size: 42px; font-weight: 600;
    padding: 12px 24px; border-radius: 16px; color: #fff; white-space: nowrap;
    background: linear-gradient(var(--blue), var(--deep));
    box-shadow: 0 6px 0 #173a9e, 0 16px 30px rgba(29,78,216,.45); }

  .card { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; }
  .card svg { width: 230px; height: 230px; filter: drop-shadow(0 30px 60px rgba(29,78,216,.55)); }
  .name { font-size: 150px; font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: 34px; }
  .tag { font-size: 46px; font-weight: 450; color: var(--dim); margin-top: 26px; letter-spacing: -.01em; }
  .tag b { color: var(--ink); font-weight: 600; }
  .url { font-family: "Plex Mono", monospace; font-size: 40px; margin-top: 46px;
    padding: 16px 34px; border-radius: 999px; color: #fff;
    background: rgba(59,130,246,.18); box-shadow: inset 0 0 0 2px rgba(59,130,246,.7); }
</style>

<div id="stage">
  <div id="grid"></div>

  <div id="window">
    <img id="shot" alt="">
    <div id="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  </div>

  <div id="scrim"></div>
  <div id="caption"><div id="key"></div><div id="line"></div></div>

  <div class="card" id="intro">
    <svg class="icon" viewBox="0 0 1024 1024"><use href="#icon"/></svg>
    <div class="name">Tabletist</div>
    <div class="tag">A small, fast, native database client.</div>
  </div>

  <div class="card" id="outro">
    <svg class="icon" viewBox="0 0 1024 1024"><use href="#icon"/></svg>
    <div class="name">Tabletist</div>
    <div class="tag"><b>PostgreSQL</b> · <b>MySQL</b> · <b>SQLite</b></div>
    <div class="tag" style="margin-top:10px">macOS · Linux · Windows</div>
    <div class="url">igor.works/tabletist</div>
  </div>
</div>

<!-- assets/icon/tabletist.svg -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="table"><rect x="208" y="248" width="608" height="528" rx="72"/></clipPath>
    <g id="icon">
      <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
      <g clip-path="url(#table)">
        <rect x="208" y="248" width="608" height="528" fill="#fff" fill-opacity=".16"/>
        <rect x="208" y="248" width="608" height="152" fill="#fff"/>
      </g>
      <rect x="236" y="276" width="552" height="472" rx="46" fill="none" stroke="#fff" stroke-width="56"/>
      <line x1="424" y1="400" x2="424" y2="748" stroke="#fff" stroke-width="48"/>
      <line x1="236" y1="516" x2="788" y2="516" stroke="#fff" stroke-width="40"/>
      <line x1="236" y1="632" x2="788" y2="632" stroke="#fff" stroke-width="40"/>
    </g>
  </defs>
</svg>

<script>
// The video's length and frame rate.
const DURATION = 15, FPS = 60;

// When each scene starts.
const BROWSE = 1.3, FILTER = 4.0, EDIT = 6.7, SQL = 9.6, END = 13.5;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const inOut = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out = k => 1 - Math.pow(1 - k, 4);
const back = k => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
// How far `t` is through the `length` seconds that start at `from`.
const span = (t, from, length) => clamp((t - from) / length);

// Which of the app's frames is on screen from when: [seconds, label, index].
// A label names the frames src/promo.rs wrote under it, in their order.
function schedule(count) {
  const at = [[0, "connected", 0], [BROWSE + .65, "browse", 0]];
  for (let i = 1; i < count.browse; i++) at.push([BROWSE + .75 + i * .27, "browse", i]);
  at.push([FILTER, "filter", 0], [FILTER + .28, "filter", 1]);
  for (let i = 2; i < count.filter; i++) at.push([FILTER + .55 + (i - 2) * .085, "filter", i]);
  at.push([FILTER + 1.45, "filtered", 0]);
  at.push([EDIT, "edit", 0], [EDIT + .28, "edit", 1]);
  for (let i = 2; i < count.edit; i++) at.push([EDIT + .55 + (i - 2) * .055, "edit", i]);
  at.push([EDIT + 1.75, "pending", 0], [EDIT + 2.1, "review", 0]);
  // A character a frame, up to the list, and on from the name it wrote.
  const first = 63;
  at.push([SQL, "sql", 0]);
  let t = SQL + .25;
  for (let i = 1; i < first; i++, t += 1 / FPS) at.push([t, "sql", i]);
  at.push([t += .16, "pick", 0], [t += .26, "picked", 0]);
  t += .1;
  for (let i = first; i < count.sql; i++, t += 1 / FPS) at.push([t, "sql", i]);
  at.push([t, "typed", 0], [t += .22, "ran", 0]);
  return at;
}

// Where the camera goes: from `at`, over `over` seconds, to the point
// (x, y) of the window (in its 1200 by 750 points) drawn `zoom` times as large.
const CAMERA = [
  { at: 0, over: 0, x: 600, y: 375, zoom: 1 },
  { at: BROWSE + .65, over: 2.1, x: 760, y: 400, zoom: 1.14, ease: k => k },
  { at: FILTER - .05, over: .5, x: 560, y: 280, zoom: 1.5 },
  { at: FILTER + 1.45, over: .5, x: 660, y: 320, zoom: 1.32 },
  { at: EDIT - .05, over: .45, x: 940, y: 385, zoom: 1.62 },
  { at: EDIT + 1.75, over: .55, x: 700, y: 520, zoom: 1.3 },
  { at: SQL - .05, over: .45, x: 620, y: 235, zoom: 1.5 },
  { at: SQL + 2.6, over: .5, x: 620, y: 505, zoom: 1.3 },
];

// What is said under each scene, and the key that does it.
const CAPTIONS = [
  { from: BROWSE + .25, to: FILTER - .15, text: "Open a table. It's just there." },
  { from: FILTER + .1, to: EDIT - .15, text: "Filter without writing SQL.", key: "⌘F" },
  { from: EDIT + .1, to: SQL - .15, text: "Edit. Review. Then save." },
  { from: SQL + .1, to: END - .1, text: "Or just write the SQL.", key: "⌘T" },
];

const $ = id => document.getElementById(id);
let frames = {}, plan = [], shown = null, said = null;

function camera(t) {
  let now = { ...CAMERA[0] };
  for (const move of CAMERA) {
    if (t < move.at) break;
    const k = move.over ? (move.ease || inOut)(span(t, move.at, move.over)) : 1;
    now = { x: mix(now.x, move.x, k), y: mix(now.y, move.y, k), zoom: mix(now.zoom, move.zoom, k) };
  }
  return now;
}

function drawWindow(t) {
  const el = $("window");
  const rise = out(span(t, BROWSE - .15, .7));
  const leave = inOut(span(t, END - .1, .6));
  if (rise === 0 || leave === 1) { el.style.opacity = 0; return; }
  const scale = 1400 / 1200, left = 260, top = 34;
  const { x, y, zoom } = camera(t);
  // Zoomed in, the point looked at comes to the middle of the picture.
  const pull = clamp((zoom - 1) * 3);
  const sx = mix(left + x * scale, 960, pull), sy = mix(top + y * scale, 450, pull);
  const size = zoom * mix(.92, 1, rise) * mix(1, .86, leave);
  const dx = sx - x * scale * size, dy = sy - y * scale * size + (1 - rise) * 160 + leave * 40;
  el.style.opacity = rise * (1 - leave);
  el.style.filter = leave ? `blur(${leave * 18}px)` : "none";
  el.style.transform = `translate(${dx}px, ${dy}px) scale(${size})`;
}

function drawCaption(t) {
  const now = CAPTIONS.find(c => t >= c.from && t < c.to + .25);
  const line = $("line"), key = $("key");
  if (!now) { line.style.opacity = 0; key.style.opacity = 0; $("scrim").style.opacity = 0; return; }
  if (said !== now) {
    said = now;
    line.innerHTML = now.text.split(" ").map(w => `<span>${w} </span>`).join("");
    key.textContent = now.key || "";
    key.style.display = now.key ? "block" : "none";
  }
  const gone = span(t, now.to, .22);
  line.style.opacity = 1 - gone;
  [...line.children].forEach((word, i) => {
    const k = out(span(t, now.from + i * .055, .42));
    word.style.opacity = k;
    word.style.transform = `translateY(${(1 - k) * 46}px)`;
  });
  const pop = span(t, now.from + .05, .4);
  key.style.opacity = clamp(pop * 3) * (1 - gone);
  key.style.transform = `scale(${back(pop)}) translateY(${-gone * 10}px)`;
  $("scrim").style.opacity = span(t, BROWSE + .25, .4) * (1 - span(t, END - .1, .3));
}

// A title card's pieces come in one after another, and leave together.
function drawCard(el, t, from, to) {
  const gone = to === null ? 0 : inOut(span(t, to, .4));
  const on = t >= from - .01 && gone < 1;
  el.style.visibility = on ? "visible" : "hidden";
  if (!on) return;
  [...el.children].forEach((piece, i) => {
    const k = span(t, from + i * .11, .55);
    const size = i === 0 ? back(k) : 1;
    piece.style.opacity = clamp(k * 2.5) * (1 - gone);
    piece.style.transform =
      `translateY(${(1 - out(k)) * (i ? 50 : 0) - gone * 90}px) scale(${size * mix(1, .94, gone)})`;
  });
}

async function renderAt(t) {
  let frame = null;
  for (const [at, label, index] of plan) {
    if (at > t + 1e-6) break;
    frame = frames[label][Math.min(index, frames[label].length - 1)];
  }
  if (frame && frame !== shown) {
    shown = frame;
    $("shot").src = frame;
    await $("shot").decode();
  }
  drawWindow(t);
  drawCaption(t);
  drawCard($("intro"), t, .08, BROWSE - .3);
  drawCard($("outro"), t, END + .15, null);
  $("grid").style.transform = `translateY(${-t * 4}px)`;
}

// `files` are the frames' paths, named `<number>-<label>.png`.
async function load(files) {
  frames = {};
  for (const file of files) {
    const label = file.replace(/^.*\/\d+-(\w+)\.png$/, "$1");
    (frames[label] ||= []).push(file);
  }
  const count = Object.fromEntries(Object.entries(frames).map(([k, v]) => [k, v.length]));
  plan = schedule(count).sort((a, b) => a[0] - b[0]);
  await document.fonts.ready;
  await renderAt(0);
  return { duration: DURATION, fps: FPS, end: plan[plan.length - 1][0] };
}
</script>
