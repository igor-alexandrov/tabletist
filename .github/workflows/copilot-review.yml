name: Request Copilot review

# The ruleset asks Copilot for a review in the pull request author's name, so
# an author without a Copilot plan gets none. This asks in the owner's name
# instead, for every pull request the owner did not open. It never checks out
# or runs the pull request's code, which is what makes pull_request_target
# and the token safe here.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # COPILOT_REVIEW_TOKEN: the owner's fine-grained token for this
      # repository, with "Pull requests: read and write".
      - run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-reviewer @copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
